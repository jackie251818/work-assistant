<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'" />
  <title>工作助手</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="panel-body">
  <div class="panel" id="panel">
    <!-- 顶部：日期 + 窗口操作（可拖动） -->
    <header class="panel-header drag">
      <div class="date-block">
        <div class="date-main">
          <span id="monthDay">--</span>
          <span class="date-unit">日</span>
        </div>
        <div class="date-sub">
          <div id="weekDay">星期--</div>
          <div id="yearText">----</div>
        </div>
      </div>
      <div class="header-actions no-drag">
        <button class="icon-btn" id="btnPin" title="固定面板（始终置顶显示）">📌</button>
        <button class="icon-btn" id="btnSettings" title="设置待办事项">⚙</button>
        <button class="icon-btn" id="btnHide" title="隐藏（托盘双击可恢复）">—</button>
      </div>
    </header>

    <!-- 进度概览 -->
    <div class="progress-wrap">
      <div class="progress-info">
        <span id="progressText">今日待办 0 项</span>
        <span id="progressPercent"></span>
      </div>
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    </div>

    <!-- 今日任务列表 -->
    <main class="task-list" id="taskList"></main>

    <!-- 空状态 -->
    <div class="empty-state" id="emptyState" hidden>
      <div class="empty-icon">✓</div>
      <div class="empty-title">今日暂无安排</div>
      <div class="empty-sub">点击右上角 ⚙ 添加每日待办</div>
    </div>

    <footer class="panel-footer" id="panelFooter"></footer>
  </div>

  <script src="shared/reminder-utils.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
